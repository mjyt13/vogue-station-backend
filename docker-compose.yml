services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vogue
      POSTGRES_PASSWORD: vogue
      POSTGRES_DB: vogue_station
    ports:
      # Bound to loopback only: Docker publishes ports via iptables, which
      # bypasses ufw — '5432:5432' would be reachable from the whole internet
      # on a public server. Nothing outside this host needs to reach Postgres
      # directly.
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vogue -d vogue_station']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    environment:
      # Same pair as S3_ACCESS_KEY_ID/S3_SECRET_ACCESS_KEY below — the app
      # authenticates as MinIO's root user. Deliberately one identity, not a
      # separate scoped IAM user: a second identity has to be created by hand
      # (mc admin user add) after every fresh volume/bucket, and silently
      # drifting from whatever's in .env is exactly what broke prod once
      # already (InvalidAccessKeyId despite the app's own creds looking right).
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
    ports:
      # Loopback only — see the note on db's port above. The app reaches
      # MinIO over the internal Compose network (S3_ENDPOINT=http://minio:9000);
      # this published port only exists for host-side scripts like
      # storage:bootstrap and admin debugging.
      # NOTE: host port is 9010, not MinIO's default 9000 — on the prod host,
      # 9000 is already taken by Portainer, and docker silently drops the
      # publish on conflict instead of failing loudly. Caddy's /storage/*
      # reverse_proxy must point at 127.0.0.1:9010 to match.
      - '127.0.0.1:9010:9000'
    volumes:
      - minio-data:/data
    command: server /data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: build # has devDependencies (prisma CLI) — runtime stage doesn't
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://vogue:vogue@db:5432/vogue_station?schema=public
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      # Loopback only — a reverse proxy (Caddy/nginx) on the host terminates
      # TLS on 80/443 and forwards to 127.0.0.1:3000. Never publish the app
      # itself on a public interface: no TLS, no rate-limit-friendly edge.
      - '127.0.0.1:3000:3000'
    environment:
      DATABASE_URL: postgresql://vogue:vogue@db:5432/vogue_station?schema=public
      PORT: '3000'
      APP_URL: ${APP_URL:-http://localhost:3000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      JWT_ACCESS_TTL: 15m
      REFRESH_TOKEN_TTL_DAYS: '30'
      STORAGE_DRIVER: s3
      STORAGE_SIGNING_SECRET: ${STORAGE_SIGNING_SECRET:?set STORAGE_SIGNING_SECRET in .env}
      S3_ENDPOINT: http://minio:9000
      # Public origin browsers can actually reach — defaults to the
      # locally-published MinIO port; override in .env for real deploys
      # (e.g. https://your-domain/storage, proxied to this container).
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_REGION: us-east-1
      S3_BUCKET: vogue-station
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
      S3_FORCE_PATH_STYLE: 'true'
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  minio-data:
